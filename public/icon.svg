<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="enable-background:new 0 0 512 512;" xml:space="preserve">
  <defs>
    <!-- Cap gradient — bright indigo top to deep blue-violet bottom -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B4FE9"/>
      <stop offset="100%" stop-color="#4338D0"/>
    </linearGradient>
    <!-- Cap base gradient — slightly darker -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B2FD0"/>
    </linearGradient>
    <!-- Tile gradient — white to light lavender-gray -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F0F5"/>
    </linearGradient>
    <!-- Tassel gradient — light orange to amber -->
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBA84C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Soft glow filter for the cap -->
    <filter id="capGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5B4FE9" flood-opacity="0.25"/>
    </filter>
    <!-- Drop shadow for the tile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded square tile background (squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileGrad)" filter="url(#tileShadow)"/>

  <!-- Soft purple glow behind the cap -->
  <ellipse cx="256" cy="260" rx="170" ry="150" fill="#5B4FE9" opacity="0.06"/>

  <!-- Cap base (chevron top, straight sides, U-bottom) -->
  <path d="M148 262 L256 318 L364 262 L364 340 Q364 432 256 432 Q148 432 148 340 Z"
        fill="url(#baseGrad)" filter="url(#capGlow)"/>

  <!-- White chevron gap between diamond and base -->
  <polygon points="256,318 218,285 256,302 294,285" fill="#FFFFFF" opacity="0.95"/>

  <!-- Mortarboard diamond (wider than tall, 2.8:1) -->
  <path d="M256 120 L434 212 L256 296 L78 212 Z" fill="url(#capGrad)" filter="url(#capGlow)"/>

  <!-- White play button triangle (centered, pointing right) -->
  <path d="M234 172 L302 212 L234 252 Z" fill="#FFFFFF"/>

  <!-- Tassel cord (from right vertex of diamond, dropping down) -->
  <path d="M434 212 L438 348" stroke="url(#tasselGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Tassel ball (circle at end of cord) -->
  <circle cx="438" cy="362" r="24" fill="url(#tasselGrad)"/>
</svg>
