services:
  - type: web
    name: sheegow-chat
    runtime: node
    plan: free
    region: oregon
    rootDir: mini-services/chat-service
    buildCommand: npm install && npm run build
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: quiet
    autoDeploy: true
