services:
  - type: web
    name: sheegow-chat
    runtime: node
    plan: free
    repo: https://github.com/phoozy54/sheegow-academy
    region: oregon
    rootDir: mini-services/chat-service
    buildCommand: npm install
    startCommand: node index.js
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: quiet
    healthCheckPath: /
    autoDeploy: true
